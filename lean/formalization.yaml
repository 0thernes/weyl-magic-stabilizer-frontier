open_problems_explicitly_not_claimed:
  - "Erew-Goldstein Conjecture 2 in the low-mana regime Mana(psi) <= (1/2) ln(D / 2)"
  - "Global upper bound M_2^max(C^d otimes C^d) <= ln(d^4 / (2d^2 - 1)) for general odd prime d >= 5 (only lower bound attainment, local stability dichotomy, and composite/n=3 sharpness are proved)"
  - "Zauner's Conjecture (existence of WH-SICs in every dimension d)"
  - "Kulhandjian-Hanzo Conjecture 27 lower bound d_min(Q(p, 2)) >= p + 1 for general primes p >= 11 (upper bound d_min <= p + 1 is proved for all odd primes p >= 3; exact equality d_min = 8 is settled at p = 7)"
