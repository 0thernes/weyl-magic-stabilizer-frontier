project:
  name: Refutation of the SIC-Clifford Stabilizer Conjecture, Trace-Norm Spectral Locking of Mana, All-Prime
    Alltop Magic Attainment, and Exact Distance Settlement of Projective-Geometry Singer Qudit Codes
  description: 'Zero-Mathlib Lean 4.35.0 formalization of four linked pillars in discrete quantum magic
    and stabilizer geometry: (1) refutation of the SIC-Clifford stabilizer conjecture; (2) trace-norm
    spectral locking of Mana; (3) all-prime Alltop magic attainment; and (4) exact distance settlement
    of projective-geometry Singer qudit codes, audited strictly within [propext, Classical.choice, Quot.sound].
    Explicitly leaves open low-mana Conjecture 2, general prime d >= 5 global M_2 upper bounds, Zauner''s
    Conjecture, and Conjecture 27 lower bounds for p >= 11.'
  authors:
  - Alexander Stephen Donahue
  responsible_maintainers:
  - Alexander Stephen Donahue
