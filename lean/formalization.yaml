  - propext
  - Classical.choice
  - Quot.sound
  forbid_sorry: true
  forbid_admit: true
  forbid_native_decide: true
  forbid_custom_axioms: true
  independent_kernels:
  - lean (Lean 4.35.0 C++ kernel)
  - leanchecker-paranoid
  - lean4lean
  - nanoda
  - con-leche
  - con-ron
  statement_contract:
    challenge: PalomarChallenge
    solution: PalomarSolution
    comparator_config: comparator.json
    comparator_flags: --paranoid
